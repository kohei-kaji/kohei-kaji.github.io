<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
  <script src="locations.js"></script>
  <style>
    html, body { margin: 0; height: 100%; }
    #map { width: 100%; height: 100%; }
    .photos { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .photos img { width: 90px; height: 90px; object-fit: cover; border-radius: 4px; cursor: pointer; }
    .photos img:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    var tiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    });
    var map = L.map('map', { center: [35, 20], zoom: 2, layers: [tiles], worldCopyJump: true });
    var markers = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 40 });

    addressPoints.forEach(function (p) {
      var m = L.circleMarker([p[1], p[2]], {
        radius: 8, color: '#fff', weight: 1.5, fillColor: '#3b82f6', fillOpacity: 0.9
      });
      var html = '<b>' + p[0].replace('<br />', '</b><br />') + '<br /><small>' + p[3] + '</small>';
      var photos = p[4] || [];
      if (photos.length) {
        html += '<div class="photos">' + photos.map(function (f) {
          var src = '/files/photos/' + encodeURIComponent(f);
          return '<a href="' + src + '" target="_blank"><img src="' + src + '" loading="lazy"></a>';
        }).join('') + '</div>';
      }
      m.bindPopup(html, { maxWidth: 320, minWidth: photos.length ? 290 : 50 });
      markers.addLayer(m);
    });
    map.addLayer(markers);
  </script>
</body>
</html>
